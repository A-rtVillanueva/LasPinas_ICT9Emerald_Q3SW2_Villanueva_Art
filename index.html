<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Villanueva, 9-E
</title> 
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"> 
<style>
    body{font-family:sans-serif; font-weight: 10px; color: aliceblue; background-image: url(nat.jpeg);}
    button:hover{box-shadow:0 8px 16px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);}
    .container{background-color: rgb(127, 154, 205); margin-top: 90px; border-style: solid; border-width: 9px;}
    .res{background-color: rgb(164, 164, 214); margin-left: 0px; margin-right: 0px; text-align: center;}
</style>
</head> 
<body> 
    <h1 style="text-align: center; font-size: 90px; font-style: italic; text-shadow: 8px 8px #000  ;">Natural Calculator</h1>
<div class="container"> 
    <br>
<details ontoggle="message()"> 
<summary> Instructions: </summmary> 
<i> Assign any values for A and for B, then click the buttons to view the results.</i> 
</details> 
<br>
<form>
<label> Value of A: </label>
<input type="number" id="num1" placeholder=" Enter a value.. ">
<br><br>
<label> Value of B: </label>
<input type="number" id="num2" placeholder=" Enter a value.. ">

<br><br>
<button type="button" onclick = "mul()" class="btn btn-danger">Multiply A to B</button><br><br>
<button type="button" onclick = "rem()" class="btn btn-success">Find the Remainder</button><br><br>
<button type="button" onclick = "rai()" class="btn btn-primary">If A raised to B</button><br><br>
<button type="button" onclick = "equ()" class="btn btn-light">Is A equal to B?</button><br><br>
<div class="res"><h1 id="Result"> Result is here </h1></div>
</form>
<br><br>
</div>

<script>
function message(){
    alert("Hah! You clicked this, now you're reading it then have to close it to continue on this page!");
}

function mul() {
    var mul1 = document.getElementById ("num1").value
    var mul2 = document.getElementById ("num2").value;
    var product = Number(mul1) * Number(mul2);
    document.getElementById('Result').innerHTML = 'The answer is... ' + product + '!';
}
function rem() {
    var rem1 = document.getElementById ("num1").value
    var rem2 = document.getElementById ("num2").value;
    var remainder = Number(rem1) % Number(rem2);
    document.getElementById('Result').innerHTML = 'The answer is... ' + remainder + '!';
}
function rai() {
    var rai1 = document.getElementById ("num1").value
    var rai2 = document.getElementById ("num2").value;
    var exponentation = Number(rai1) ** Number(rai2);
    document.getElementById('Result').innerHTML = 'The answer is... ' + exponentation + '!';
}
function equ() {
    var equ1 = document.getElementById ("num1").value
    var equ2 = document.getElementById ("num2").value;
    var equivalence = Number(equ1) == Number(equ2);
    document.getElementById('Result').innerHTML = 'The answer is... ' + equivalence + '!';
}

</script>


</body>
</html>
